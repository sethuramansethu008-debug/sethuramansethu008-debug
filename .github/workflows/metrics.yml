name: Generate Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC

jobs:
  build-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.dashboard.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: sethuramansethu008-debug
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # --- visual theme: dark neon, matches the hero banner ---
          config_display: large
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: all

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 60

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes

          plugin_stars: yes
          plugin_stars_limit: 4

          plugin_introduction: yes
          plugin_introduction_title: yes

# ── SETUP ──────────────────────────────────────────────
# 1. Repo → Settings → Secrets and variables → Actions
#    → New repository secret → name it METRICS_TOKEN
#    → value: a Personal Access Token (classic) with `repo` + `read:user` scope
# 2. Save this file as .github/workflows/metrics.yml in your
#    <username>/<username> profile repo
# 3. Run it once manually from the Actions tab — it commits
#    metrics.dashboard.svg back into your repo
# 4. Reference it in README.md (already wired in below)
# ────────────────────────────────────────────────────────