<svg width="100%" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="45%" stop-color="#0a1930"/>
      <stop offset="100%" stop-color="#001d3d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#4dabff"/>
      <stop offset="100%" stop-color="#7f5bff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- animated grid -->
  <g stroke="#1c3a5e" stroke-width="1" opacity="0.35">
    <g>
      <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="280" x2="1200" y2="280"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="100" y1="0" x2="100" y2="320"/><line x1="300" y1="0" x2="300" y2="320"/>
      <line x1="500" y1="0" x2="500" y2="320"/><line x1="700" y1="0" x2="700" y2="320"/>
      <line x1="900" y1="0" x2="900" y2="320"/><line x1="1100" y1="0" x2="1100" y2="320"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- orbiting particles -->
  <g filter="url(#blurGlow)">
    <circle cx="150" cy="60" r="3" fill="#00f5ff">
      <animate attributeName="cy" values="60;260;60" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="250" r="4" fill="#7f5bff">
      <animate attributeName="cy" values="250;40;250" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="30" r="2.5" fill="#4dabff">
      <animate attributeName="cx" values="600;950;600" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="290" r="3.5" fill="#00f5ff">
      <animate attributeName="cx" values="250;80;250" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- center glow pulse -->
  <circle cx="600" cy="150" r="220" fill="url(#glow)">
    <animate attributeName="r" values="200;240;200" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- main title -->
  <text x="600" y="150" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="54" font-weight="700" fill="url(#textGrad)">
    SETHURAMAN R
  </text>
  <text x="600" y="150" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="54" font-weight="700" fill="none" stroke="#00f5ff" stroke-width="0.6" opacity="0.5">
    SETHURAMAN R
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- animated typing subtitle -->
  <text x="600" y="200" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="20" fill="#8fd8ff">
    <tspan>&gt; building AI + Blockchain systems for real-world trust</tspan>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.15;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor -->
  <rect x="855" y="185" width="12" height="22" fill="#00f5ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#00f5ff" opacity="0.7">
    <animate attributeName="y" values="0;318;0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>